<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">熊志愿的八阶段 AI 设计与迭代工作流</title><desc id="desc">灵感发散、多渠道检索、个人组织、辅助方案、原型、测试、反馈、交付。完整指令建立上下文，精准短指令逐轮控制，专业判断贯穿全程。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#8fb5a8"/></marker></defs><rect width="1200" height="660" rx="24" fill="#f8f6ef"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="49" font-size="30" font-weight="700" fill="#233b38">AI 设计 · 从完整任务到精准迭代</text><text x="32" y="80" font-size="19" fill="#536b66">我决定方向、审美与验收标准；AI 协助探索、实现与局部修改。</text><rect x="32" y="108" width="272" height="170" rx="16" fill="#eae9f5" stroke="#8ea9a1" stroke-opacity=".3"/><text x="50" y="141" font-size="17" fill="#536b66">01</text><text x="50" y="181" font-size="25" font-weight="700" fill="#233b38">灵感发散</text><text x="50" y="218" font-size="18" fill="#536b66">Chat：展开问题与备选</text><text x="50" y="251" font-size="18" fill="#536b66">输出：概念关键词</text><path d="M306 193H317" stroke="#8fb5a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="108" width="272" height="170" rx="16" fill="#eae9f5" stroke="#8ea9a1" stroke-opacity=".3"/><text x="338" y="141" font-size="17" fill="#536b66">02</text><text x="338" y="181" font-size="25" font-weight="700" fill="#233b38">多渠道检索</text><text x="338" y="218" font-size="18" fill="#536b66">案例 / 原始资料 / 文档</text><text x="338" y="251" font-size="18" fill="#536b66">输出：证据与限制</text><path d="M594 193H605" stroke="#8fb5a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="608" y="108" width="272" height="170" rx="16" fill="#dfede3" stroke="#8ea9a1" stroke-opacity=".3"/><text x="626" y="141" font-size="17" fill="#536b66">03</text><text x="626" y="181" font-size="25" font-weight="700" fill="#233b38">个人思维组织</text><text x="626" y="218" font-size="18" fill="#536b66">我组织信息、确定取舍</text><text x="626" y="251" font-size="18" fill="#536b66">输出：问题与视觉基准</text><path d="M882 193H893" stroke="#8fb5a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="896" y="108" width="272" height="170" rx="16" fill="#eae9f5" stroke="#8ea9a1" stroke-opacity=".3"/><text x="914" y="141" font-size="17" fill="#536b66">04</text><text x="914" y="181" font-size="25" font-weight="700" fill="#233b38">AI 辅助方案</text><text x="914" y="218" font-size="18" fill="#536b66">完整指令说明目标与边界</text><text x="914" y="251" font-size="18" fill="#536b66">输出：任务、分工、验收</text><rect x="32" y="332" width="272" height="170" rx="16" fill="#eae9f5" stroke="#8ea9a1" stroke-opacity=".3"/><text x="50" y="365" font-size="17" fill="#536b66">05</text><text x="50" y="405" font-size="25" font-weight="700" fill="#233b38">原型实现</text><text x="50" y="442" font-size="18" fill="#536b66">Codex / 生成 / 专业制作</text><text x="50" y="475" font-size="18" fill="#536b66">输出：可编辑素材与原型</text><path d="M306 417H317" stroke="#8fb5a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="332" width="272" height="170" rx="16" fill="#dfede3" stroke="#8ea9a1" stroke-opacity=".3"/><text x="338" y="365" font-size="17" fill="#536b66">06</text><text x="338" y="405" font-size="25" font-weight="700" fill="#233b38">迭代与测试</text><text x="338" y="442" font-size="18" fill="#536b66">视觉评审 + 实际运行</text><text x="338" y="475" font-size="18" fill="#536b66">输出：问题与局部修改</text><path d="M594 417H605" stroke="#8fb5a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="608" y="332" width="272" height="170" rx="16" fill="#eae9f5" stroke="#8ea9a1" stroke-opacity=".3"/><text x="626" y="365" font-size="17" fill="#536b66">07</text><text x="626" y="405" font-size="25" font-weight="700" fill="#233b38">反馈与再检索</text><text x="626" y="442" font-size="18" fill="#536b66">精准短指令 + 提示词更新</text><text x="626" y="475" font-size="18" fill="#536b66">输出：下一轮任务与约束</text><path d="M882 417H893" stroke="#8fb5a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="896" y="332" width="272" height="170" rx="16" fill="#f4e8c9" stroke="#8ea9a1" stroke-opacity=".3"/><text x="914" y="365" font-size="17" fill="#536b66">08</text><text x="914" y="405" font-size="25" font-weight="700" fill="#233b38">精修与交付</text><text x="914" y="442" font-size="18" fill="#536b66">人工细化、核对、归档</text><text x="914" y="475" font-size="18" fill="#536b66">输出：作品、源码、证据</text><path d="M1168 194H1182V306H18V417H30" fill="none" stroke="#8fb5a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="537" width="1136" height="96" rx="14" fill="#dfede3"/><text x="52" y="571" font-size="23" font-weight="700" fill="#233b38">完整指令定方向 → 精准短指令改局部 → 逐轮对照验收</text><text x="52" y="608" font-size="19" fill="#536b66">补知识回到检索 · 改方向回到个人组织 · 修视觉调整提示词或人工制作 · 修逻辑返回 Codex</text></g></svg>