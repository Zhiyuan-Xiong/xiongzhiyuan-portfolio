<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">茶园物语：AI 协作与设计控制流程</title><desc id="desc">八个阶段形成循环：完整指令建立上下文，分批生成与 Godot 实现，人工评审与精准短指令迭代，最后组织工程与网页交付。</desc><rect width="1200" height="720" rx="24" fill="#f4f1e9"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
